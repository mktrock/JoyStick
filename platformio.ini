; 既定は BLE・WiFi とも停止(発熱を抑えるため)。出力は USB シリアルのみ
[env:xiao-esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3  ; USB CDC on boot は board 定義で有効
framework = arduino
monitor_speed = 115200

; BLE(Nordic UART Service)でも出力する版
[env:xiao-esp32c3-ble]
extends = env:xiao-esp32c3
build_flags = -DENABLE_BLE
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3

; ジョイスティック未配線での動作確認用(円を描く擬似入力、BOOT ボタン = SW)
[env:xiao-esp32c3-sim]
extends = env:xiao-esp32c3
build_flags = -DSIMULATE
